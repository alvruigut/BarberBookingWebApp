spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: gestion-citas
  datasource:
    url: ${BD_URL}
    username: ${BD_USUARIO}
    password: ${BD_CONTRASENA}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Europe/Madrid
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null
  session:
    timeout: 30m
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        # Firebase y Render son sitios distintos: usa COOKIE_SAME_SITE=none y COOKIE_SEGURA=true.
        same-site: ${COOKIE_SAME_SITE:lax}
        secure: ${COOKIE_SEGURA:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
aplicacion:
  cancelacion:
    maximo-intentos: 5
    ventana-minutos: 15
    bloqueo-minutos: 15
    horas-limite: 24
    secreto-hmac: ${SECRETO_HMAC_CANCELACION}
  autenticacion:
    maximo-intentos: 5
    bloqueo-minutos: 15
  reservas-publicas:
    maximo-intentos: 3
    ventana-minutos: 5
    maximo-citas-futuras-por-telefono: 2
  privacidad:
    meses-conservacion-datos-clientes: 24
  cors:
    # En Render: CORS_ORIGENES_PERMITIDOS=https://tu-proyecto.web.app,https://tu-proyecto.firebaseapp.com
    origenes-permitidos: ${CORS_ORIGENES_PERMITIDOS:http://localhost:3000,http://localhost:5173}
